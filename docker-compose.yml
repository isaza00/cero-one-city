services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: cero, POSTGRES_PASSWORD: cero, POSTGRES_DB: cero }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]   # volumen nombrado, NUNCA bind NTFS
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cero"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: &env
      DATABASE_URL: postgresql+asyncpg://cero:cero@db:5432/cero
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret
      MASTER_KEY: ZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMtYmFzZTY0PT0=
      WATCHFILES_FORCE_POLLING: "true"   # inotify does not cross the WSL 9p mount
      ENV: dev
      MIN_TURN_SECONDS: "2"              # watchable live matches (~80s per match)
    volumes: ["./server:/srv/server", "./engine:/srv/engine"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: arq app.worker.WorkerSettings --watch /srv/server
    environment: *env
    volumes: ["./server:/srv/server", "./engine:/srv/engine"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  pgdata: {}
