[project]
name = "cero-server"
version = "0.1.0"
description = "Servidor de Cero One City (FastAPI + arq)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5",
    "arq>=0.26",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.8",
    "httpx>=0.27",
    "argon2-cffi>=23",
    "pyjwt>=2.9",
    "cryptography>=43",
    "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "websockets>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]   # EXE queda fuera: el bind mount NTFS marca todo ejecutable

[tool.ruff.lint.isort]
known-first-party = ["app", "cero_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
